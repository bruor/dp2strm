# dp2strm Configuration File

# Dispatcharr Server Settings (REST API)
dispatcharr_url: "https://your-dispatcharr-server.com"
api_key: "YOUR_DISPATCHARR_ADMIN_API_KEY"

# Output Settings for Generated STRM & NFO files
output_dir: "/data/strm"
retention_grace_days: 7

# Embedded HTTP Playback Proxy Server
proxy_port: 8080
proxy_public_url: "http://localhost:8080" # URL accessible by Emby/Jellyfin players

# Sync Ticker Interval
sync_interval: "1h"
batch_size: 1000

# Resiliency & Fallback (Circuit Breaker)
circuit_breaker_enabled: true
max_probe_concurrency: 5

# Emby / Jellyfin Library Refresh Trigger (Optional)
emby_url: "http://localhost:8096"
emby_api_key: "" # Leave blank to disable automated Emby library refresh
