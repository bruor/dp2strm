services:
  dp2strm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dp2strm
    restart: unless-stopped
    ports:
      # Host:Container port mapping for HTTP 302 redirect handler
      - "8080:8080"
    volumes:
      # Persistent volume mount for generated .strm files, .nfo metadata, poster/fanart artwork, and SQLite db
      - ./strm:/data/strm
    environment:
      # --- Required Connection Parameters ---
      # Dispatcharr REST API Base URL
      - DISPATCHARR_URL=${DISPATCHARR_URL:-https://your-dispatcharr-server.com}

      # Dispatcharr API Key (Admin level recommended for bulk VOD listing)
      - DISPATCHARR_API_KEY=${DISPATCHARR_API_KEY:-YOUR_DISPATCHARR_API_KEY}

      # --- Path & Network Handler Options ---
      # Container path for generated media library tree and SQLite database
      - OUTPUT_DIR=/data/strm

      # Port for the embedded HTTP playback handler (302 redirect server)
      - PORT=8080

      # Base URL accessible by Emby/Jellyfin players to reach this service
      - URL=${URL:-http://localhost:8080}

      # --- Scheduling & Timezone Options ---
      # Container timezone for cron schedule evaluation (e.g., "America/Toronto", "America/New_York", "UTC")
      - TZ=${TZ:-America/Toronto}

      # Scheduled background sync interval (e.g., "1h", "2h", "30m"). Default: 1h
      - SYNC_INTERVAL=${SYNC_INTERVAL:-1h}

      # Optional: 5-field Cron Expression for scheduled sync runs (e.g., "0 3 * * *" for 3:00 AM daily). Overrides SYNC_INTERVAL if set.
      - SYNC_CRON=${SYNC_CRON:-}

      # Batch limit per sync pass (0 = Unlimited full library sync, Default: 0)
      - BATCH_SIZE=${BATCH_SIZE:-0}

      # --- Streamcache Integration Options (Optional) ---
      # Transparent streamcache service URL (e.g., "http://streamcache:8080"). If empty, 302 redirects directly to Dispatcharr.
      - STREAMCACHE_URL=${STREAMCACHE_URL:-}

      # Predictive fetch-ahead episode cache count for seamless TV playback. Only active when STREAMCACHE_URL is set (default: 2)
      - FETCH_AHEAD_COUNT=${FETCH_AHEAD_COUNT:-2}

      # Grace period in days to buffer deleted streams before purging from disk (Default: 7)
      - RETENTION_GRACE_DAYS=${RETENTION_GRACE_DAYS:-7}

      # --- Emby / Jellyfin Rescan Hooks (Optional) ---
      # Emby/Jellyfin Server URL for automated library rescan triggers
      - EMBY_URL=${EMBY_URL:-}

      # Emby/Jellyfin API Key for automated library rescan triggers
      - EMBY_API_KEY=${EMBY_API_KEY:-}
