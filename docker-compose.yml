services:
  dp2strm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dp2strm
    restart: unless-stopped
    # ports:
    #   - "8080:8080"
    volumes:
      # Generated .strm media tree mount
      - ./strm:/data/strm
      # Dedicated SQLite database mount
      - ./data:/data/db
    environment:
      # --- Required Connection Parameters ---
      - DISPATCHARR_URL=https://your-dispatcharr-server.com
      - DISPATCHARR_API_KEY=YOUR_DISPATCHARR_API_KEY
      # - DISPATCHARR_XC_USER= # Optional: only needed if using legacy XC fallback
      # - DISPATCHARR_XC_PASSWORD= # Optional: only needed if using legacy XC fallback

      # --- Path & Network Handler Options ---
      - OUTPUT_DIR=/data/strm
      - PORT=8080
      - URL=http://dp2strm:8080

      # --- Scheduling & Worker Pipeline Options ---
      - TZ=America/Toronto
      - SYNC_INTERVAL=4h # Dispatcharr catalog delta ingest interval (Default: 4h)
      - SYNC_CRON= # Optional: e.g. "0 */4 * * *" for cron schedule
      - RECONCILE_INTERVAL=24h # Daily deep disk reconciler interval (Default: 24h)
      - RECONCILE_CRON= # Optional: e.g. "0 3 * * *" for 3:00 AM daily reconciliation
      - SKIP_STARTUP_SYNC=false # Set to true to skip initial staging pass on boot
      - BATCH_SIZE=0 # 0 = Unlimited full library sync, >0 = shared budget with dynamic rollover
      - DISPATCHARR_ORDERING=-created_at # Server-side sorting prioritizing recent updates & additions
      - PAGE_SIZE=100 # Number of items fetched per API page request (Default: 100)
      - DISPATCHARR_WORKERS=1 # Number of concurrent workers staging from Dispatcharr (Default: 1)
      - EMBY_WORKERS=1 # Number of concurrent workers processing queue & Emby updates (Default: 1)
      - EMBY_PACE_DELAY=100ms # Delay between items processed by Emby worker (Default: 100ms)
      - MAX_PROBE_CONCURRENCY=5 # Number of parallel worker goroutines for direct movie sync (Default: 5)
      - ENABLE_NFO=false # Disabled by default. Unactivated S01E01 NFO is still created, then purged on activation
      - ACTIVATION_REFRESH_DELAY=10s # Max wait for Emby playback session before metadata refresh (Default: 10s)

      # --- Streamcache Integration Options (Optional) ---
      - STREAMCACHE_URL= # e.g. http://streamcache:8080
      - FETCH_AHEAD_COUNT=2 # Active only when STREAMCACHE_URL is set
      - RETENTION_GRACE_DAYS=7

      # --- Emby / Jellyfin Rescan Hooks (Zero-Config Auto-Discovered) ---
      - EMBY_URL= # e.g. http://emby:8096
      - EMBY_API_KEY= # Emby API Token
      - EMBY_MEDIA_PATH= # Optional override: only needed if auto-discovery fails (e.g. /media/strm)
      - EMBY_TV_LIBRARY= # Optional override: library name if multiple TV libraries exist (e.g. "TV shows")
      - EMBY_MOVIES_LIBRARY= # Optional override: library name if multiple Movie libraries exist (e.g. "Movies")
