services:
  dp2strm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dp2strm
    restart: unless-stopped
    volumes:
      # Generated .strm media tree mount
      - ./strm:/data/strm
      # Dedicated SQLite database mount
      - ./data:/data/db
    environment:
      # --- Required Connection Parameters ---
      - DISPATCHARR_URL=https://your-dispatcharr-server.com
      - DISPATCHARR_API_KEY=YOUR_DISPATCHARR_API_KEY
      - DISPATCHARR_XC_USER=your_xc_username
      - DISPATCHARR_XC_PASSWORD=your_xc_password

      # --- Path & Network Handler Options ---
      - OUTPUT_DIR=/data/strm
      - DB_PATH=/data/db/dp2strm.db
      - PORT=8080
      - URL=http://dp2strm:8080

      # --- Scheduling & Timezone Options ---
      - TZ=America/Toronto
      - SYNC_INTERVAL=1h
      - SYNC_CRON= # Optional: e.g. "0 3 * * *" for 3:00 AM daily
      - SKIP_STARTUP_SYNC=false # Set to true to skip initial sync pass on boot
      - BATCH_SIZE=0 # 0 = Unlimited full library sync

      # --- Streamcache Integration Options (Optional) ---
      - STREAMCACHE_URL= # e.g. http://streamcache:8080
      - FETCH_AHEAD_COUNT=2 # Active only when STREAMCACHE_URL is set
      - RETENTION_GRACE_DAYS=7

      # --- Emby / Jellyfin Rescan Hooks (Optional) ---
      - EMBY_URL=
      - EMBY_API_KEY=
