services:
  dp2strm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dp2strm
    restart: unless-stopped
    ports:
      # Port mapping for HTTP playback handler (Host:Container)
      - "8080:8080"
    volumes:
      # Persistent volume mount for generated .strm files, .nfo metadata, and poster/fanart artwork
      - ./strm:/data/strm
    environment:
      # Dispatcharr REST API Base URL (Required)
      - DISPATCHARR_URL=${DISPATCHARR_URL:-https://your-dispatcharr-server.com}

      # Dispatcharr API Key (Admin level recommended for bulk listing, Required)
      - DISPATCHARR_API_KEY=${DISPATCHARR_API_KEY:-YOUR_DISPATCHARR_API_KEY}

      # Target directory inside container for generated media tree
      - OUTPUT_DIR=/data/strm

      # Port for the embedded HTTP client playback handler (302 redirect server)
      - PROXY_PORT=8080

      # Public URL of the playback handler accessible by Emby/Jellyfin players
      - PROXY_PUBLIC_URL=${PROXY_PUBLIC_URL:-http://localhost:8080}

      # Scheduled background sync interval (e.g., "1h", "2h", "30m", "0" for single run)
      - SYNC_INTERVAL=${SYNC_INTERVAL:-1h}

      # Optional: Cron Expression for scheduled runs (e.g., "0 3 * * *" for 3:00 AM daily)
      - SYNC_CRON=${SYNC_CRON:-}

      # Container timezone for cron schedule evaluation (Default: UTC, e.g., "America/New_York")
      - TZ=${TZ:-UTC}

      # Batch processing limit per sync pass (0 = Unlimited full library sync, Default: 0)
      - BATCH_SIZE=${BATCH_SIZE:-0}

      # --- Streamcache Integration Options ---
      # Transparent streamcache service URL for on-disk stream proxy caching (e.g., "http://streamcache:8080")
      - STREAMCACHE_URL=${STREAMCACHE_URL:-}

      # Predictive fetch-ahead episode cache count for seamless TV playback (default: 2)
      - FETCH_AHEAD_COUNT=${FETCH_AHEAD_COUNT:-2}

      # Number of grace days to buffer deleted streams before purging (Default: 7)
      - RETENTION_GRACE_DAYS=${RETENTION_GRACE_DAYS:-7}

      # Optional: Emby/Jellyfin Server URL for automated library rescan triggers
      - EMBY_URL=${EMBY_URL:-}

      # Optional: Emby/Jellyfin API Key for automated library rescan triggers
      - EMBY_API_KEY=${EMBY_API_KEY:-}
