<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGlow)" />

  <!-- Center Card Content -->
  <g transform="translate(960, 480)" text-anchor="middle">
    <!-- Glowing Badge Pill -->
    <g transform="translate(0, -90)">
      <rect x="-130" y="-22" width="260" height="44" rx="22" fill="#0f172a" stroke="url(#badgeGrad)" stroke-width="2" />
      <circle cx="-85" cy="0" r="5" fill="#10b981" filter="url(#glow)" />
      <text x="10" y="6" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="3">ACTIVATED</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="20" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">Series Activated</text>

    <!-- Subtitle -->
    <text x="0" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400">Episodes are populating into your library</text>

    <!-- Hint -->
    <text x="0" y="140" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400">Please return to the series in a few moments to watch</text>
  </g>
</svg>
